server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # En production, nginx joue le meme role que le proxy Vite en dev :
    # il relaie /api vers le backend (nom du service dans le reseau compose).
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application React : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
