server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Les assets versionnes par Vite peuvent etre caches longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application React : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
